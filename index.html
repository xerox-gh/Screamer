:#a7d4ed;margin:0 0 16px}.scoreline{display:flex;align-items:center;justify-content:space-around;text-align:center;gap:10px}.club{font-size:19px}.club small{display:block;font-size:11px;color:#a3cee9;margin-top:10px}.shield{clip-path:polygon(0 0,100% 0,92% 73%,50% 100%,8% 73%);width:66px;height:80px;background:#f2c842;border:6px solid #ffeb94;display:grid;place-items:center;color:#123558;font-size:28px;margin:12px auto}.shield.away{background:#944cbb;color:#fff;border-color:#c89cdb}.vs{color:#61a1ca;font-size:20px}.hero{margin:22px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.hero button{min-width:180px}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}.stat{background:#052e59;border-top:3px solid #f04b56;padding:15px 12px;text-align:center}.stat b{display:block;color:#ffe070;font-size:24px;margin-bottom:7px}.stat small{font-size:10px;color:#a3c9e3}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.nav button{font-size:12px;padding:16px 6px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:16px}.card{background:linear-gradient(#c6dce1,#edf0de 70%,#80909b 71%);border:4px solid #cedbe5;box-shadow:4px 4px #002a50;color:#092c4c;text-align:center;padding:8px}.card .role{display:flex;justify-content:space-between;font-size:12px}.card canvas{width:96px;height:96px;image-rendering:pixelated;display:block;margin:auto}.card .name{background:#627586;color:white;padding:5px 1px;font-size:12px}.stars{color:#ffcf49;text-shadow:1px 1px #483724;letter-spacing:2px;padding:6px;font-size:15px}.bar{background:#021a32;height:9px;border:1px solid #173859}.bar i{display:block;height:100%;background:linear-gradient(#b4ff57,#4fb936)}.card small{font-size:10px;display:block;margin:7px 0}.card button{font-size:10px;width:100%;padding:8px 2px}.footer{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.footer button{font-size:12px}.rows{width:100%;border-collapse:co ize:10px;color:#8fb9d7;margin-top:14px}.intro{color:#e4f1f7;font-size:14px;line-height:1.7}.matchtitle{font-size:11px;letter-spacing:2px;color:#93c4dd;margin:0 0 10px}.results{font-size:54px;letter-spacing:12px;color:#fff!important}.mobiletip{display:none}@media(max-width:700px){header{padding:17px}.topline{margin:18px 12px 14px;padding:10px}.topline h1{font-size:19px}.topline span{display:none}.content{padding:0 12px 18px}.grid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.matchhud{font-size:10px;padding:10px 6px}.controls label{margin-left:0}.hero{align-items:stretch;flex-direction:column}.rows td,.rows th{padding:10px 4px;font-size:11px}.mobiletip{display:block}.desktophelp{display:none}}

:9px;color:#153a4c;display:flex;justify-content:space-around;padding-top:6px}.badgeRow{display:flex;gap:8px;align-items:center;margin-bottom:12px}.badgeRow .tag{background:#0c3456;padding:7px}.homepitch{padding:0;overflow:hidden;margin-bottom:16px}.squad-meta{font-size:10px;color:#2d5265;min-height:13px;padding-top:6px}

</style></head><body><main id="app"></main><div id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), app=$('#app'), KEY='screamer-save-v1';
const CLUBS=['Columbia Athletic','Portside FC','Northbridge','Kingsfield','Ashford Town','Eastborough','Riverside','Westhaven'];
const NAMES=['Reed','Baptiste','Okoro','Silva','Park','Diallo','Vega','Novak','Belton','Costa','Mensah'];
const ROLES=['GK','DEF','DEF','DEF','DEF','MID','MID','MID','FWD','FWD','FWD'];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), rand=(a,b)=>a+Math.random()*(b-a), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let screen='home', game=null, frame=0, last=0, sound=false, audio=null, toastTimer, keys={};
function fresh(){return {version:1,club:CLUBS[0],coins:600,season:1,week:0,formation:'4-3-3',kit:0,stadium:1,training:1,academy:1,table:CLUBS.map((name,id)=>({id,name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})),squad:NAMES.map((name,i)=>({id:i,name,role:ROLES[i],rating:Math.round(rand(57,76)),condition:100,skin:i%4,hair:i%5})),market:[],history:[],schedule:schedule()};}
function schedule(){let a=[0,1,2,3,4,5,6,7],weeks=[];for(let r=0;r<7;r++){weeks.push(Array.from({length:4},(_,i)=>[a[i],a[7-i]]));a.splice(1,0,a.pop())}return [...weeks,...weeks.map(w=>w.map(p=>[p[1],p[0]]))]}
function valid(s) {
  if (!s || typeof s !== 'object' || s.version !== 1) return false;
  const integer=(n,min,max)=>Number.isInteger(n)&&n>=min&&n<=max;
  const player=p=>p&&typeof p.name==='string'&&p.name.length>0&&p.name.length<=40&&ROLES.includes(p.role)&&integer(p.rating,1,99)&&integer(p.condition,0,100)&&integer(p.skin,0,3)&&integer(p.hair,0,4)&&integer(p.id,0,100000)&&(p.goals===undefined||integer(p.goals,0,1000000))&&(p.assists===undefined||integer(p.assists,0,1000000));
  if(typeof s.club!=='string'||!s.club.trim()||s.club.length>24||!integer(s.coins,0,1e12)||!integer(s.week,0,14)||!integer(s.season,1,100000)||![0,1].includes(s.kit))return false;
  if(!['4-3-3','4-4-2','3-5-2'].includes(s.formation)||![s.stadium,s.training,s.academy].every(x=>integer(x,1,5)))return false;
  if(!Array.isArray(s.squad)||s.squad.length!==11||!s.squad.every(player)||s.squad.filter(p=>p.role==='GK').length!==1)return false;
  if(!Array.isArray(s.table)||s.table.length!==8||!s.table.every((t,i)=>t&&t.id===i&&typeof t.name==='string'&&['p','w','d','l','gf','ga','pts'].every(k=>integer(t[k],0,1e6))&&t.p===s.week&&t.w+t.d+t.l===t.p&&t.pts===t.w*3+t.d))return false;
  if(!Array.isArray(s.schedule)||s.schedule.length!==14)return false;
  const pairs=new Map();
  for(const w of s.schedule){if(!Array.isArray(w)||w.length!==4||!w.every(p=>Array.isArray(p)&&p.length===2&&p.every(i=>integer(i,0,7))&&p[0]!==p[1])||new Set(w.flat()).size!==8)return false;for(const p of w){const k=p.join('-');pairs.set(k,(pairs.get(k)||0)+1)}}
  if(pairs.size!==56||[...pairs.values()].some(n=>n!==1))return false;
  if(!Array.isArray(s.market)||s.market.length>6||!s.market.every(p=>player(p)&&integer(p.price,1,1000000))||!Array.isArray(s.history)||!s.history.every(r=>typeof r==='string'))return false;
  if(s.options){const o=s.options;if(typeof o!=='object'||!['casual','normal','hard'].includes(o.difficulty)||!['follow','wide'].includes(o.camera)||![90,150].includes(o.duration)||typeof o.autoRun!=='boolean'||typeof o.replay!=='boolean')return false}
  return true;
}
let state=fresh(),loadWarning='';try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(valid(s))state=s;else loadWarning='Saved data could not be loaded. A new club is ready.'}}catch(e){loadWarning='Browser saves are unavailable. You can export your progress from the office.'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Unable to save in this browser. Export your club from the office.')}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',3500)}
function beep(freq=600,len=.07){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+len);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+len)}catch(e){}}
function opponent(){const f=state.schedule[Math.min(13,state.week)].find(p=>p.includes(0));return f.find(i=>i!==0)}
function sorted(){return [...state.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function rating(){return Math.round(state.squad.reduce((s,p)=>s+p.rating,0)/11)}
function stars(r){return '★'.repeat(Math.round(r/20))+'☆'.repeat(5-Math.round(r/20))}
function btn(text,action,cls=''){return `<button class="${cls}" data-action="${action}">${text}</button>`}
function shell(title,body){app.innerHTML=`<header><div class="brand">SCREAMER<small>THE BEAUTIFUL GAME. REWOUND.</small></div><div class="coins">● ${state.coins.toLocaleString()}<small>CLUB CREDITS</small></div></header><div class="topline"><h1>${title}</h1><span>SEASON ${state.season} / ${esc(state.club).toUpperCase()}</span></div><section class="content">${body}</section>`}
function table(full=true){return `<table class="rows"><thead><tr><th>#</th><th>CLUB</th><th>P</th>${full?'<th>W</th><th>D</th><th>L</th><th>GD</th>':''}<th>PTS</th></tr></thead><tbody>${sorted().map((t,i)=>`<tr class="${t.id===0?'home':''}"><td>${i+1}</td><td>${esc(t.id===0?state.club:t.name)}</td><td>${t.p}</td>${full?`<td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf-t.ga}</td>`:''}<td>${t.pts}</td></tr>`).join('')}</tbody></table>`}
function go(s){if(game&&!game.over&&screen==='match'&&s!=='match')return;screen=s;if(s==='home')home();if(s==='squad')squad();if(s==='formation')formation();if(s==='office')office();if(s==='market')market();if(s==='league')league();if(s==='help')help();if(s==='preview')preview();beep(400,.035)}
function home(){shell('MANAGER’S DESK',`<div class="grid"><div><div class="panel"><h2>${state.week>=14?'SEASON COMPLETE':'NEXT FIXTURE · MATCHDAY '+(state.week+1)+' / 14'}</h2><div class="scoreline"><div class="club"><div class="shield">CA</div>${esc(state.club)}<small>${rating()} OVR · ${state.formation}</small></div><span class="vs">VS</span><div class="club"><div class="shield away">${CLUBS[opponent()].split(' ').map(x=>x[0]).join('')}</div>${CLUBS[opponent()]}<small>${63+opponent()*2} OVR · 4-4-2</small></div></div><div class="hero"><div class="muted">${state.week>=14?'Your league position: '+(sorted().findIndex(t=>t.id===0)+1):'A new match. A chance to make a name.<br>Take your club to the top.'}</div>${btn(state.week>=14?'NEXT SEASON →':'KICK OFF →',state.week>=14?'newseason':'preview')}</div></div><div class="nav">${btn('★ Squad','squad')}${btn('▥ Formation','formation')}${btn('⇄ Transfers','market')}${btn('▰ Club office','office')}</div><p class="muted">Original arcade football · Offline ready · Progress saves on this browser</p></div><div><div class="statrow"><div class="stat"><b>${sorted().findIndex(t=>t.id===0)+1}</b><small>LEAGUE POSITION</small></div><div class="stat"><b>${state.table[0].pts}</b><small>POINTS</small></div><div class="stat"><b>${rating()}</b><small>SQUAD RATING</small></div></div><div class="panel"><h2>SCREAMER LEAGUE</h2>${table(false)}<div class="footer">${btn('FULL TABLE','league','secondary')}${btn('HOW TO PLAY','help','secondary')}</div></div></div></div>`)}
function playerCard(p,i,buy=false){return `<article class="card"><div class="role"><b>${p.role}</b><b>${p.rating}</b></div><canvas width="48" height="48" data-face="${i}" aria-label="Pixel portrait of ${esc(p.name)}"></canvas><div class="name">${esc(p.name.toUpperCase())}</div><div class="stars">${stars(p.rating)}</div><div class="bar"><i style="width:${clamp(p.condition,0,100)}%"></i></div><small>${buy?'TRANSFER FEE':p.condition+'% CONDITION'}</small><div class="skills"><span>FIT ${p.condition}%</span><span>${p.role==='GK'?'REF':'OVR'} ${p.rating}</span></div>${buy?btn('● '+p.price,'buy:'+i):'<div class="squad-meta">'+(p.goals||0)+' GOALS · '+(p.assists||0)+' ASSISTS</div>'}</article>`}
function faces(list){document.querySelectorAll('[data-face]').forEach(c=>portrait(c.getContext('2d'),list[+c.dataset.face]))}
function portrait(c,p){const skin=['#efb185','#a46640','#754933','#d99765'][p.skin%4],hair=['#251c1a','#402b22','#d8b564','#161d25','#773b21'][p.hair%5];c.fillStyle=['#7ab2bb','#91af75','#c4a779'][p.id%3];c.fillRect(0,0,48,48);c.fillStyle='#193151';c.fillRect(10,34,28,14);c.fillStyle='#f9d359';c.fillRect(12,34,24,14);c.fillStyle=skin;c.fillRect(20,29,8,9);c.fillRect(14,10,20,21);c.fillRect(12,17,24,9);c.fillStyle=hair;c.fillRect(14,7,20,8);c.fillRect(12,11,5,8);c.fillRect(31,11,4,p.hair%2?19:9);if(p.hair===1){c.fillRect(10,12,5,20);c.fillRect(15,5,17,5)}if(p.hair===4)c.fillRect(17,4,12,6);c.fillStyle='#1a2737';c.fillRect(18,19,3,2);c.fillRect(28,19,3,2);c.fillStyle='#b16b4b';c.fillRect(24,22,2,4);c.fillRect(21,28,8,2)}
function squad(){shell('STAR PLAYERS',`<div class="statrow"><div class="stat"><b>${rating()}</b><small>TEAM RATING</small></div><div class="stat"><b>${Math.round(state.squad.reduce((s,p)=>s+p.condition,0)/11)}%</b><small>CONDITION</small></div><div class="stat"><b>${state.formation}</b><small>FORMATION</small></div></div><div class="cards">${state.squad.map((p,i)=>playerCard(p,i)).join('')}</div><div class="footer">${btn('← BACK','home')}${btn('TRAIN SQUAD · ● 100','train')}${btn('TRANSFERS','market')}</div><p class="muted">Training improves every player by 1 rating. Condition recovers between fixtures; club facilities improve recovery.</p>`);faces(state.squad)}

  const dir=end?1:-1;
  if(!front){
    polygon(c,[[end,235,0],[end+dir*38,235,0],[end+dir*38,385,0],[end,385,0]],'#15382d55');
    polygon(c,[[end+dir*38,235,0],[end+dir*38,235,57],[end+dir*38,385,57],[end+dir*38,385,0]],'#edf0d52d');
    for(let y=235;y<=385;y+=9)line(c,[[end,y,57],[end+dir*38,y,57],[end+dir*38,y,0]],'#d5e5c777',.8);
    for(let z=0;z<=57;z+=8)line(c,[[end+dir*38,235,z],[end+dir*38,385,z]],'#d5e5c777',.8);
  } else line(c,[[end,235,0],[end,235,57],[end,385,57],[end,385,0]],'#f6f5dd',3);
}
function drawPitch(c) {
  polygon(c,[[-160,-150],[1160,-150],[1160,790],[-160,790]],'#48714e');
  for(let x=-150;x<1200;x+=42) {
    const a=project(x,-95);c.fillStyle='#263e54';c.fillRect(a.x-3,a.y-24,40,50);
    for(let r=0;r<4;r++)for(let k=0;k<6;k++){c.fillStyle=['#d9c39a','#6b8b9d','#f1d252','#b7666b','#142c4a'][Math.abs((r*7+k*3+Math.floor(x))%5)];c.fillRect(a.x+k*6,a.y-20+r*10,3,5)}
  }
  line(c,[[-120,-30],[1120,-30]],'#132e40',17);
  for(let x=-50;x<1100;x+=160){const p=project(x,-30);c.fillStyle=x%320?'#efca46':'#e8ece1';c.fillRect(p.x-25,p.y-4,100,11);c.fillStyle='#183b49';c.font='bold 8px monospace';c.fillText('SCREAMER FC',p.x-19,p.y+4)}
  for(let i=0;i<12;i++)polygon(c,[[i*1000/12,0],[(i+1)*1000/12,0],[(i+1)*1000/12,620],[i*1000/12,620]],i%2?'#368d45':'#30813f');
  // Deterministic grass detail, with no changing random noise between frames.
  c.fillStyle='#c7d77313';for(let i=0;i<650;i++){const p=project((i*137)%1000,(i*83)%620);c.fillRect(p.x,p.y,2,1)}
  c.lineWidth=2;polygon(c,[[0,0],[1000,0],[1000,620],[0,620]],null,'#c2dca7');line(c,[[500,0],[500,620]]);
  const circle=[];for(let i=0;i<=60;i++){const a=i/60*Math.PI*2;circle.push([500+85*Math.cos(a),310+85*Math.sin(a)])}line(c,circle);
  for(const end of [0,1000]){
    const d=end?-1:1;line(c,[[end,140],[end+d*165,140],[end+d*165,480],[end,480]]);line(c,[[end,235],[end+d*55,235],[end+d*55,385],[end,385]]);
    const dot=project(end+d*115,310);c.fillStyle='#d1ddb0';c.fillRect(dot.x-2,dot.y-2,4,4);goal(c,end);
    for(const y of [0,620]){line(c,[[end,y],[end,y,25]],'#efead6',1);polygon(c,[[end,y,25],[end+d*12,y,22],[end,y,18]],'#f4ca44')}
  }
}
function draw() {
  const canvas=$('#pitch');if(!canvas||!game)return;
  const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;
  let players=game.players,ball=game.ball,cam=game.camera;
  if(game.replay){const r=game.replay,f=r.frames[Math.min(r.frames.length-1,Math.floor(r.time/r.duration*r.frames.length))];players=game.players.map((p,i)=>({...p,...f.players[i]}));ball=f.ball;cam=f.camera}
  c.fillStyle='#132e3e';c.fillRect(0,0,1100,690);
  c.save();c.translate(550,310);c.scale(cam.zoom,cam.zoom);c.translate(-cam.x,-cam.y);
  drawPitch(c);
  if(game.target&&!game.replay){const p=project(game.target.x,game.target.y);c.strokeStyle='#ffe978';c.lineWidth=1.5;c.beginPath();c.ellipse(p.x,p.y,7,4,0,0,7);c.stroke()}
  const selected=players[game.selected],sp=project(selected.x,selected.y);
  if(!game.replay){c.strokeStyle='#ffdf60';c.lineWidth=2;c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?8:16,x=sp.x+Math.cos(a)*r,y=sp.y+Math.sin(a)*r*.5;i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath();c.stroke()}
  players.slice().sort((a,b)=>project(a.x,a.y).y-project(b.x,b.y).y).forEach(p=>{const pos=project(p.x,p.y);sprite(c,pos.x,pos.y,p.team,p.i,1,p.anim,p)});
  const bp=project(ball.x,ball.y,ball.z),shadow=project(ball.x,ball.y);
  c.fillStyle='#15372388';c.beginPath();c.ellipse(shadow.x,shadow.y+2,5,2.5,0,0,7);c.fill();
  if(game.owner===-1&&!game.replay)game.trail.forEach((p,i)=>{const s=project(p.x,p.y,p.z);c.fillStyle=`rgba(255,250,211,${i/40})`;c.fillRect(s.x-1,s.y-1,2,2)});
  c.fillStyle='#f5f3dc';c.fillRect(Math.round(bp.x)-4,Math.round(bp.y)-6,7,7);c.fillRect(Math.round(bp.x)-5,Math.round(bp.y)-4,9,3);c.fillStyle='#263948';c.fillRect(Math.round(bp.x)-1,Math.round(bp.y)-5,3,3);c.fillRect(Math.round(bp.x)-4,Math.round(bp.y)-1,2,2);
  goal(c,0,true);goal(c,1000,true);c.restore();
  if(game.aim&&game.owner>=0&&!game.players[game.owner].team){
    const a=game.aim,v=aimVector(a),p=viewPoint(project(ball.x,ball.y));
    if(dist(a.start,a.end)>6){
      c.strokeStyle='#fff186';c.lineWidth=3;c.setLineDash([8,6]);c.beginPath();c.moveTo(p.x,p.y);
      let x=ball.x,y=ball.y,vx=v.vx,vy=v.vy;
      for(let n=0;n<18;n++){x+=vx*.016;y+=vy*.016;const ox=vx;vx-=vy*v.curl*.016;vy+=ox*v.curl*.016;const s=viewPoint(project(x,y));c.lineTo(s.x,s.y)}c.stroke();c.setLineDash([]);
      c.fillStyle='#082d3de8';c.fillRect(p.x-70,p.y-83,140,32);c.fillStyle='#ffe482';c.font='bold 11px monospace';c.textAlign='center';c.fillText(`${game.chip?'CHIP':'POWER'} ${Math.round(v.power/9)}% ${v.curl?' / CURL':''}`,p.x,p.y-63);c.textAlign='left';
    }
  }
  // Player panel and radar stay in screen space as the camera tracks play.
  c.fillStyle='#061f30ed';c.fillRect(20,604,255,65);c.fillStyle=state.kit?'#60ccef':'#f2ce4e';c.fillRect(20,604,4,65);
  c.font='bold 17px monospace';c.fillStyle='#fff1b3';c.fillText(state.squad[game.selected].name.toUpperCase(),35,628);
  c.font='9px monospace';c.fillStyle='#97bdc6';c.fillText('STAMINA',35,645);c.fillStyle='#233f49';c.fillRect(97,638,157,7);c.fillStyle=selected.energy<25?'#f4825d':'#9ce362';c.fillRect(97,638,157*selected.energy/100,7);
  c.fillStyle='#769b9d';c.fillText(game.autoRun?'AUTO RUN ON · ATTACK →':'MANUAL RUN · ATTACK →',35,659);
  c.fillStyle='#082c2fe8';c.fillRect(904,574,176,103);c.strokeStyle='#92b7a1';c.lineWidth=1;c.strokeRect(912,583,160,85);c.beginPath();c.moveTo(992,583);c.lineTo(992,668);c.ellipse(992,625.5,12,12,0,0,7);c.stroke();
  players.forEach(p=>{c.fillStyle=p.team?'#e4d9d9':'#f4d65c';c.fillRect(912+p.x*.16-1,583+p.y*.137-1,3,3)});c.fillStyle='#fff';c.fillRect(912+ball.x*.16-2,583+ball.y*.137-2,4,4);
  if(game.msgTime>0&&!game.replay){c.fillStyle='#06283be6';c.fillRect(210,34,680,70);c.fillStyle='#f9dd6b';c.textAlign='center';c.font='bold italic 25px monospace';c.fillText(game.message,550,77);c.textAlign='left'}
  if(game.replay){c.fillStyle='#071d32dd';c.fillRect(25,23,155,34);c.fillStyle='#f2cd68';c.font='bold 15px monospace';c.fillText('● REPLAY',40,45);c.fillStyle='#092739cc';c.fillRect(330,619,450,37);c.fillStyle='#f8e8b5';c.font='12px monospace';c.textAlign='center';c.fillText('TAP PITCH OR PRESS R TO SKIP',555,642);c.textAlign='left'}
  for(const p of game.particles){c.fillStyle=p.color;c.fillRect(p.x,p.y,5,8)}
}
function loop(now) {
  if(screen!=='match')return;
  let remaining=Math.min((now-last)/1000,.08);last=now;
  while(remaining>0){const step=Math.min(remaining,1/120);update(step);remaining-=step}
  draw();frame=requestAnimationFrame(loop);
}
function matchSummary() {
  const s=game.stats,total=s.possession[0]+s.possession[1],pct=total?Math.round(s.possession[0]/total*100):50;
  return `<div class="summarygrid">${[['SHOTS',...s.shots],['ON TARGET',...s.onTarget],['SAVES',...s.saves],['PASSES',...s.complete],['POSSESSION',pct+'%',100-pct+'%']].map(([label,a,b])=>`<div><b>${a}</b><span>${label}</span><b>${b}</b></div>`).join('')}</div><div class="goalLog">${game.events.map(e=>`<p>${e.minute}′ · ${e.team===0?esc(e.scorer):CLUBS[game.opp]} ⚽</p>`).join('')}</div>`;
}
document.addEventListener('keydown', e => {
  if(screen!=='match'||['INPUT','SELECT'].includes(e.target.tagName))return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Shift'].includes(k))e.preventDefault();
  keys[k]=true;if(e.repeat)return;
  if(k==='p'||k==='Escape')return pause();
  if(k==='r')return skipReplay();
  if(!ready())return;
  if(k===' ')autoShoot();if(k==='x')pass();if(k==='z')pass(true);if(k==='c')switchPlayer();
  if(game.aim&&(k==='q'||k==='e'))game.aim.curl=k==='q'?-.65:.65;
});
document.addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
window.addEventListener('blur',()=>{keys={};if(screen==='match'&&game&&!game.paused&&!game.over)pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='match'&&game&&!game.paused&&!game.over)pause()});

app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const [a,v]=b.dataset.action.split(':');if(['home','squad','formation','office','market','league','help','preview'].includes(a))return go(a);if(a==='start')start();if(a==='buy')buy(+v);if(a==='kit'){state.kit=state.kit?0:1;save();preview()}if(a==='train'){if(state.coins<100)return toast('Training costs 100 credits.');if(state.squad.every(p=>p.rating===99))return toast('Your squad has reached maximum rating.');state.coins-=100;state.squad.forEach(p=>p.rating=Math.min(99,p.rating+1));save();squad();toast('Training complete: +1 to every player’s rating.')}if(a==='upgrade'&&['stadium','training','academy'].includes(v)&&state[v]<5){const cost=state[v]*200;if(state.coins<cost)return toast('You need '+cost+' credits.');state.coins-=cost;state[v]++;save();office()}if(a==='rename'){const name=$('#clubname').value.trim();if(name){state.club=name;save();office();toast('Club name updated.')}}if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='screamer-club.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(a==='import')$('#importFile').click();if(a==='newseason')nextSeason();if(a==='pause')pause();if(a==='pass')pass();if(a==='through')pass(true);if(a==='camera'&&game){state.options={...options(),camera:options().camera==='follow'?'wide':'follow'};save();toast(options().camera==='follow'?'Following camera':'Whole-pitch camera')}if(a==='fullscreen'){const wrap=$('.content');if(document.fullscreenElement)document.exitFullscreen?.();else wrap?.requestFullscreen?.().catch(()=>toast('Fullscreen is unavailable in this browser.'))}if(a==='shoot')autoShoot();if(a==='switch')switchPlayer();if(a==='sound'){sound=!sound;b.textContent='SOUND: '+(sound?'ON':'OFF');beep()}if(a==='quit'||a==='done'){cancelAnimationFrame(frame);game=null;keys={};screen='home';home()} });
home();if(loadWarning)toast(loadWarning);
</script></body></html>
