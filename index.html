<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064c91"><title>Screamer — Football Club</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071827;color:#fff;font-family:'Courier New',monospace;font-weight:bold}button,select,input{font:inherit}button{cursor:pointer;color:#fff;border:2px solid #ff6262;border-bottom:5px solid #760e27;background:linear-gradient(135deg,#f9565e,#cc1437 40%,#a4082b);padding:12px 20px;text-transform:uppercase;letter-spacing:1px;box-shadow:3px 3px 0 #031e47}button:hover{filter:brightness(1.2);transform:translateY(-1px)}button:active{transform:translateY(2px)}button:disabled{filter:grayscale(1);opacity:.5;cursor:default}button.secondary{background:#134577;border-color:#498bc0;border-bottom-color:#082a4b}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffe05d;outline-offset:4px}#app{max-width:1200px;min-height:100vh;margin:auto;background:repeating-linear-gradient(125deg,transparent 0 95px,#ffffff03 95px 100px),radial-gradient(ellipse at top,#106fb4,#03487f 70%);border-inline:1px solid #3575a1}header{display:flex;align-items:center;gap:16px;padding:24px 30px 17px;border-bottom:3px solid #1c83bd}header .brand{font-size:28px;font-style:italic;letter-spacing:-2px;color:#fff;text-shadow:3px 3px #c21a38}header small{color:#86bbde;font-size:10px;letter-spacing:3px;display:block;margin-top:5px}header .coins{margin-left:auto;color:#ffe077;font-size:18px}.topline{display:flex;align-items:center;gap:15px;margin:26px 28px 20px;padding:12px 18px;background:linear-gradient(110deg,#f04c58,#ba082c 65%,#740f2e);border-top:3px solid #ff9794;border-bottom:4px solid #051e3a;box-shadow:4px 4px #023b68}.topline h1{font-size:25px;margin:0;font-style:italic;text-shadow:2px 2px #6e1930}.topline span{margin-left:auto;font-size:11px;color:#ffd2ce}.content{padding:0 28px 28px}.muted{color:#9dc9e4;font-size:12px;line-height:1.7}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}.panel{background:#073767b8;border:2px solid #2375a5;box-shadow:4px 4px #002e54;padding:20px}.panel h2{font-size:13px;letter-spacing:2px;color:#a7d4ed;margin:0 0 16px}.scoreline{display:flex;align-items:center;justify-content:space-around;text-align:center;gap:10px}.club{font-size:19px}.club small{display:block;font-size:11px;color:#a3cee9;margin-top:10px}.shield{clip-path:polygon(0 0,100% 0,92% 73%,50% 100%,8% 73%);width:66px;height:80px;background:#f2c842;border:6px solid #ffeb94;display:grid;place-items:center;color:#123558;font-size:28px;margin:12px auto}.shield.away{background:#944cbb;color:#fff;border-color:#c89cdb}.vs{color:#61a1ca;font-size:20px}.hero{margin:22px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.hero button{min-width:180px}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}.stat{background:#052e59;border-top:3px solid #f04b56;padding:15px 12px;text-align:center}.stat b{display:block;color:#ffe070;font-size:24px;margin-bottom:7px}.stat small{font-size:10px;color:#a3c9e3}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.nav button{font-size:12px;padding:16px 6px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:16px}.card{background:linear-gradient(#c6dce1,#edf0de 70%,#80909b 71%);border:4px solid #cedbe5;box-shadow:4px 4px #002a50;color:#092c4c;text-align:center;padding:8px}.card .role{display:flex;justify-content:space-between;font-size:12px}.card canvas{width:96px;height:96px;image-rendering:pixelated;display:block;margin:auto}.card .name{background:#627586;color:white;padding:5px 1px;font-size:12px}.stars{color:#ffcf49;text-shadow:1px 1px #483724;letter-spacing:2px;padding:6px;font-size:15px}.bar{background:#021a32;height:9px;border:1px solid #173859}.bar i{display:block;height:100%;background:linear-gradient(#b4ff57,#4fb936)}.card small{font-size:10px;display:block;margin:7px 0}.card button{font-size:10px;width:100%;padding:8px 2px}.footer{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.footer button{font-size:12px}.rows{width:100%;border-collapse:collapse;font-size:12px}.rows th{color:#81bce1;font-size:10px;letter-spacing:1px}.rows td,.rows th{text-align:left;padding:12px 8px;border-bottom:1px solid #22608a}.rows tr.home{background:#1976a5;color:#fff3a6}.tag{color:#ffdb62;font-size:11px}.upgrade{padding:16px 0;display:flex;gap:15px;align-items:center;border-bottom:1px solid #28638d}.upgrade>div{flex:1}.upgrade p{font-size:12px;margin:0 0 9px}.upgrade button{font-size:11px;min-width:100px}select,input{background:#052c51;color:#fff;border:2px solid #3982b0;padding:10px;max-width:100%}.help{font-size:12px;line-height:1.9;color:#bfdeed}.help strong{color:#ffe070}.matchwrap{position:relative;background:#051d20;border:3px solid #1f78a2;overflow:hidden}.matchwrap canvas{width:100%;display:block;touch-action:none;image-rendering:pixelated}.matchhud{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#041f37;padding:12px 16px;font-size:13px}.matchhud b{color:#ffe77f}.matchhud button{font-size:10px;padding:7px 12px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;background:#07345b}.controls button{font-size:11px;padding:10px 12px}.controls label{margin-left:auto;font-size:11px;color:#b2d9ec}.controls input{vertical-align:middle}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#061d36c9;z-index:2}.modal{background:#074775;border:3px solid #5a9fc3;padding:30px;text-align:center;max-width:90%;box-shadow:9px 9px #021526}.modal h2{color:#ffe275;font-size:30px;margin:5px 0 15px}.modal p{font-size:13px;line-height:1.8}.modal button{margin:5px}#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#031e37;border:2px solid #fbd76b;color:#fff;padding:13px 22px;font-size:12px;z-index:9;max-width:90%;text-align:center;display:none}.pitchmini{width:100%;image-rendering:pixelated;background:#227c45;border:3px solid #98be9b;margin-bottom:16px}.legend{display:flex;justify-content:space-between;font-size:10px;color:#8fb9d7;margin-top:14px}.intro{color:#e4f1f7;font-size:14px;line-height:1.7}.matchtitle{font-size:11px;letter-spacing:2px;color:#93c4dd;margin:0 0 10px}.results{font-size:54px;letter-spacing:12px;color:#fff!important}.mobiletip{display:none}@media(max-width:700px){header{padding:17px}.topline{margin:18px 12px 14px;padding:10px}.topline h1{font-size:19px}.topline span{display:none}.content{padding:0 12px 18px}.grid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.matchhud{font-size:10px;padding:10px 6px}.controls label{margin-left:0}.hero{align-items:stretch;flex-direction:column}.rows td,.rows th{padding:10px 4px;font-size:11px}.mobiletip{display:block}.desktophelp{display:none}}
</style></head><body><main id="app"></main><div id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), app=$('#app'), KEY='screamer-save-v1';
const CLUBS=['Columbia Athletic','Portside FC','Northbridge','Kingsfield','Ashford Town','Eastborough','Riverside','Westhaven'];
const NAMES=['Reed','Baptiste','Okoro','Silva','Park','Diallo','Vega','Novak','Belton','Costa','Mensah'];
const ROLES=['GK','DEF','DEF','DEF','DEF','MID','MID','MID','FWD','FWD','FWD'];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), rand=(a,b)=>a+Math.random()*(b-a), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let screen='home', game=null, frame=0, last=0, sound=false, audio=null, toastTimer, keys={};
function fresh(){return {version:1,club:CLUBS[0],coins:600,season:1,week:0,formation:'4-3-3',kit:0,stadium:1,training:1,academy:1,table:CLUBS.map((name,id)=>({id,name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})),squad:NAMES.map((name,i)=>({id:i,name,role:ROLES[i],rating:Math.round(rand(57,76)),condition:100,skin:i%4,hair:i%5})),market:[],history:[],schedule:schedule()};}
function schedule(){let a=[0,1,2,3,4,5,6,7],weeks=[];for(let r=0;r<7;r++){weeks.push(Array.from({length:4},(_,i)=>[a[i],a[7-i]]));a.splice(1,0,a.pop())}return [...weeks,...weeks.map(w=>w.map(p=>[p[1],p[0]]))]}
function valid(s){return s&&s.version===1&&typeof s.club==='string'&&s.club.length>0&&s.club.length<=24&&[0,1].includes(s.kit)&&Number.isFinite(s.coins)&&s.coins>=0&&Number.isInteger(s.week)&&s.week>=0&&s.week<=14&&Number.isInteger(s.season)&&s.season>0&&['4-3-3','4-4-2','3-5-2'].includes(s.formation)&&[s.stadium,s.training,s.academy].every(x=>Number.isInteger(x)&&x>=1&&x<=5)&&Array.isArray(s.squad)&&s.squad.length===11&&s.squad.every(p=>typeof p.name==='string'&&ROLES.includes(p.role)&&Number.isFinite(p.rating)&&p.rating>=1&&p.rating<=99&&Number.isFinite(p.condition))&&Array.isArray(s.table)&&s.table.length===8&&s.table.every((t,i)=>t.id===i&&typeof t.name==='string'&&['p','w','d','l','gf','ga','pts'].every(k=>Number.isInteger(t[k])&&t[k]>=0))&&Array.isArray(s.schedule)&&s.schedule.length===14&&s.schedule.every(w=>Array.isArray(w)&&w.length===4&&w.every(p=>p.length===2&&p.every(i=>Number.isInteger(i)&&i>=0&&i<8)))&&Array.isArray(s.market)&&s.market.every(p=>typeof p.name==='string'&&ROLES.includes(p.role)&&Number.isFinite(p.rating)&&Number.isFinite(p.price)&&p.price>0)&&Array.isArray(s.history)}
let state=fresh(),loadWarning='';try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(valid(s))state=s;else loadWarning='Saved data could not be loaded. A new club is ready.'}}catch(e){loadWarning='Browser saves are unavailable. You can export your progress from the office.'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Unable to save in this browser. Export your club from the office.')}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',3500)}
function beep(freq=600,len=.07){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+len);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+len)}catch(e){}}
function opponent(){const f=state.schedule[Math.min(13,state.week)].find(p=>p.includes(0));return f.find(i=>i!==0)}
function sorted(){return [...state.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function rating(){return Math.round(state.squad.reduce((s,p)=>s+p.rating,0)/11)}
function stars(r){return '★'.repeat(Math.round(r/20))+'☆'.repeat(5-Math.round(r/20))}
function btn(text,action,cls=''){return `<button class="${cls}" data-action="${action}">${text}</button>`}
function shell(title,body){app.innerHTML=`<header><div class="brand">SCREAMER<small>THE BEAUTIFUL GAME. REWOUND.</small></div><div class="coins">● ${state.coins.toLocaleString()}<small>CLUB CREDITS</small></div></header><div class="topline"><h1>${title}</h1><span>SEASON ${state.season} / ${esc(state.club).toUpperCase()}</span></div><section class="content">${body}</section>`}
function table(full=true){return `<table class="rows"><thead><tr><th>#</th><th>CLUB</th><th>P</th>${full?'<th>W</th><th>D</th><th>L</th><th>GD</th>':''}<th>PTS</th></tr></thead><tbody>${sorted().map((t,i)=>`<tr class="${t.id===0?'home':''}"><td>${i+1}</td><td>${esc(t.id===0?state.club:t.name)}</td><td>${t.p}</td>${full?`<td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf-t.ga}</td>`:''}<td>${t.pts}</td></tr>`).join('')}</tbody></table>`}
function go(s){if(game&&!game.over&&screen==='match'&&s!=='match')return;screen=s;if(s==='home')home();if(s==='squad')squad();if(s==='formation')formation();if(s==='office')office();if(s==='market')market();if(s==='league')league();if(s==='help')help();if(s==='preview')preview();beep(400,.035)}
function home(){shell('MANAGER’S DESK',`<div class="grid"><div><div class="panel"><h2>${state.week>=14?'SEASON COMPLETE':'NEXT FIXTURE · MATCHDAY '+(state.week+1)+' / 14'}</h2><div class="scoreline"><div class="club"><div class="shield">CA</div>${esc(state.club)}<small>${rating()} OVR · ${state.formation}</small></div><span class="vs">VS</span><div class="club"><div class="shield away">${CLUBS[opponent()].split(' ').map(x=>x[0]).join('')}</div>${CLUBS[opponent()]}<small>${63+opponent()*2} OVR · 4-4-2</small></div></div><div class="hero"><div class="muted">${state.week>=14?'Your league position: '+(sorted().findIndex(t=>t.id===0)+1):'A new match. A chance to make a name.<br>Take your club to the top.'}</div>${btn(state.week>=14?'NEXT SEASON →':'KICK OFF →',state.week>=14?'newseason':'preview')}</div></div><div class="nav">${btn('★ Squad','squad')}${btn('▥ Formation','formation')}${btn('⇄ Transfers','market')}${btn('▰ Club office','office')}</div><p class="muted">Original arcade football · Offline ready · Progress saves on this browser</p></div><div><div class="statrow"><div class="stat"><b>${sorted().findIndex(t=>t.id===0)+1}</b><small>LEAGUE POSITION</small></div><div class="stat"><b>${state.table[0].pts}</b><small>POINTS</small></div><div class="stat"><b>${rating()}</b><small>SQUAD RATING</small></div></div><div class="panel"><h2>SCREAMER LEAGUE</h2>${table(false)}<div class="footer">${btn('FULL TABLE','league','secondary')}${btn('HOW TO PLAY','help','secondary')}</div></div></div></div>`)}
function playerCard(p,i,buy=false){return `<article class="card"><div class="role"><b>${p.role}</b><b>${p.rating}</b></div><canvas width="48" height="48" data-face="${i}" aria-label="Pixel portrait of ${esc(p.name)}"></canvas><div class="name">${esc(p.name.toUpperCase())}</div><div class="stars">${stars(p.rating)}</div><div class="bar"><i style="width:${clamp(p.condition,0,100)}%"></i></div><small>${buy?'TRANSFER FEE':p.condition+'% CONDITION'}</small>${buy?btn('● '+p.price,'buy:'+i):''}</article>`}
function faces(list){document.querySelectorAll('[data-face]').forEach(c=>portrait(c.getContext('2d'),list[+c.dataset.face]))}
function portrait(c,p){const skin=['#efb185','#a46640','#754933','#d99765'][p.skin%4],hair=['#251c1a','#402b22','#d8b564','#161d25','#773b21'][p.hair%5];c.fillStyle=['#7ab2bb','#91af75','#c4a779'][p.id%3];c.fillRect(0,0,48,48);c.fillStyle='#193151';c.fillRect(10,34,28,14);c.fillStyle='#f9d359';c.fillRect(12,34,24,14);c.fillStyle=skin;c.fillRect(20,29,8,9);c.fillRect(14,10,20,21);c.fillRect(12,17,24,9);c.fillStyle=hair;c.fillRect(14,7,20,8);c.fillRect(12,11,5,8);c.fillRect(31,11,4,p.hair%2?19:9);if(p.hair===1){c.fillRect(10,12,5,20);c.fillRect(15,5,17,5)}if(p.hair===4)c.fillRect(17,4,12,6);c.fillStyle='#1a2737';c.fillRect(18,19,3,2);c.fillRect(28,19,3,2);c.fillStyle='#b16b4b';c.fillRect(24,22,2,4);c.fillRect(21,28,8,2)}
function squad(){shell('STAR PLAYERS',`<div class="statrow"><div class="stat"><b>${rating()}</b><small>TEAM RATING</small></div><div class="stat"><b>${Math.round(state.squad.reduce((s,p)=>s+p.condition,0)/11)}%</b><small>CONDITION</small></div><div class="stat"><b>${state.formation}</b><small>FORMATION</small></div></div><div class="cards">${state.squad.map((p,i)=>playerCard(p,i)).join('')}</div><div class="footer">${btn('← BACK','home')}${btn('TRAIN SQUAD · ● 100','train')}${btn('TRANSFERS','market')}</div><p class="muted">Training improves every player by 1 rating. Condition recovers between fixtures; club facilities improve recovery.</p>`);faces(state.squad)}
function formation(){shell('FORMATION',`<div class="grid"><div class="panel"><canvas id="formationPitch" class="pitchmini" width="640" height="380" aria-label="Team formation diagram"></canvas><label class="tag">TACTICAL SHAPE <select id="shape">${['4-3-3','4-4-2','3-5-2'].map(x=>`<option ${state.formation===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="panel"><h2>YOUR GAME PLAN</h2><p class="intro">${state.formation==='4-3-3'?'Wide forwards stretch the defence. Find a winger, cut inside, and shoot.':state.formation==='4-4-2'?'Two strikers give you a passing option up front. Keep your midfield close.':'Extra midfielders create short passing options. Three defenders hold the line.'}</p><p class="help">Your shape sets starting positions and the runs your teammates make.<br><br><strong>Attack right →</strong> in every match.</p></div></div><div class="footer">${btn('← BACK','home')}${btn('NEXT GAME','preview')}</div>`);const c=$('#formationPitch').getContext('2d');c.fillStyle='#287b43';c.fillRect(0,0,640,380);c.strokeStyle='#c0d6ad';c.lineWidth=2;c.strokeRect(20,20,600,340);c.beginPath();c.moveTo(320,20);c.lineTo(320,360);c.moveTo(365,190);c.arc(320,190,45,0,Math.PI*2);c.stroke();positions(state.formation,0).forEach((p,i)=>{const x=20+p.x*.6,y=20+p.y*.55;sprite(c,x,y,0,i,2,0);c.fillStyle='#052a35';c.fillRect(x-31,y+8,62,13);c.fillStyle='#fff';c.font='9px monospace';c.textAlign='center';c.fillText(state.squad[i].name,x,y+18)});$('#shape').onchange=e=>{state.formation=e.target.value;save();formation()}}
function market(){if(!state.market.length){const names=['Santos','Kovac','Adeyemi','Leroux','Tanaka','Bennett'];state.market=names.map((name,i)=>{const r=Math.round(rand(65,88));return {id:20+i,name,role:['GK','DEF','DEF','MID','MID','FWD'][i],rating:r,condition:100,skin:i%4,hair:i%5,price:(r-50)*18}});save()}shell('TRANSFER MARKET',`<p class="muted">Sign a player to replace your lowest-rated player in the same position. New prospects arrive each matchday.</p><div class="cards">${state.market.map((p,i)=>playerCard(p,i,true)).join('')}</div><div class="footer">${btn('← BACK','home')}${btn('YOUR SQUAD','squad')}</div>`);faces(state.market)}
function buy(i){const p=state.market[i];if(!p)return;if(state.coins<p.price)return toast('Not enough credits. Earn more by playing matches.');const candidates=state.squad.map((x,j)=>({x,j})).filter(v=>v.x.role===p.role).sort((a,b)=>a.x.rating-b.x.rating);const j=candidates[0].j;state.coins-=p.price;const old=state.squad[j].name;state.squad[j]={...p};state.market.splice(i,1);save();market();toast(p.name+' signed, replacing '+old+'.')}
function office(){shell('CLUB OFFICE',`<div class="grid"><div class="panel"><h2>BUILD YOUR CLUB</h2>${[['stadium','STADIUM','More matchday income'],['training','TRAINING GROUND','Faster condition recovery'],['academy','YOUTH ACADEMY','Bigger end-of-season rating boost']].map(([key,name,desc])=>`<div class="upgrade"><div><p>${name} <span class="tag">LV ${state[key]} / 5</span></p><div class="bar"><i style="width:${state[key]*20}%"></i></div><p class="muted">${desc}</p></div>${state[key]<5?btn('● '+(state[key]*200),'upgrade:'+key):'<span class="tag">MAX</span>'}</div>`).join('')}</div><div class="panel"><h2>CLUB IDENTITY</h2><label class="tag" for="clubname">CLUB NAME</label><p><input id="clubname" maxlength="24" value="${esc(state.club)}"></p>${btn('SAVE NAME','rename')}<h2 style="margin-top:28px">SAVE FILE</h2><p class="muted">Progress stays on this device. Export a backup to move your club to another browser.</p><div class="footer">${btn('EXPORT','export','secondary')}${btn('IMPORT','import','secondary')}</div><input id="importFile" type="file" accept="application/json,.json" hidden></div></div><div class="footer">${btn('← BACK','home')}</div>`);$('#importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const s=JSON.parse(await f.text());if(!valid(s))throw Error();state=s;save();office();toast('Club imported.')}catch(err){toast('Invalid save file. Your current club was not changed.')}}}
function league(){shell('LEAGUE TABLE',`<div class="panel">${table()}<p class="muted">Win: 3 points · Draw: 1 point · Tiebreak: goal difference, then goals scored</p></div><div class="panel" style="margin-top:18px"><h2>RECENT RESULTS</h2>${state.history.length?state.history.slice(-5).reverse().map(r=>`<p class="help">${esc(r)}</p>`).join(''):'<p class="muted">Your story starts with the first whistle.</p>'}</div><div class="footer">${btn('← BACK','home')}</div>`)}
function help(){shell('HOW TO PLAY',`<div class="grid"><div class="panel"><h2>ON THE BALL</h2><p class="help"><strong>Move:</strong> WASD / arrow keys, or tap an empty patch of grass.<br><strong>Aim:</strong> press anywhere on the pitch and drag backward. Release to kick in the opposite direction. The arrow shows the shot.<br><strong>Power:</strong> a longer drag makes a harder shot.<br><strong>Pass:</strong> tap a teammate or press X.<br><strong>Shoot:</strong> press Space for a shot toward goal.<br><strong>Chip:</strong> enable CHIP before dragging, or hold Shift.<br><strong>Sprint:</strong> hold Shift while running.</p></div><div class="panel"><h2>OFF THE BALL</h2><p class="help"><strong>Switch player:</strong> press C or use SWITCH.<br><strong>Tackle:</strong> get close to the ball carrier and press X / TACKLE.<br><strong>Pause:</strong> Escape or P.<br><strong>Goal:</strong> attack the right-hand goal. Stay between the posts and below the crossbar.<br><br>Each match lasts 90 real seconds. Aiming slows the action. Your opponents play, pass, tackle, and shoot. Out-of-play restarts are automatic.</p></div></div><div class="footer">${btn('← BACK','home')}${btn('PLAY MATCH','preview')}</div>`)}

function loop(now){if(screen!=='match')return;const dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw();frame=requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{if(screen!=='match'||e.target.tagName==='INPUT')return;const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Shift'].includes(k))e.preventDefault();keys[k]=true;if(e.repeat)return;if(k===' '&&!game.paused)autoShoot();if(k==='x')pass();if(k==='c')switchPlayer();if(k==='p'||k==='Escape')pause()});
document.addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});window.addEventListener('blur',()=>{keys={};if(screen==='match'&&game&&!game.paused&&!game.over)pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='match'&&game&&!game.paused&&!game.over)pause()});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const [a,v]=b.dataset.action.split(':');if(['home','squad','formation','office','market','league','help','preview'].includes(a))return go(a);if(a==='start')start();if(a==='buy')buy(+v);if(a==='kit'){state.kit=state.kit?0:1;save();preview()}if(a==='train'){if(state.coins<100)return toast('Training costs 100 credits.');if(state.squad.every(p=>p.rating===99))return toast('Your squad has reached maximum rating.');state.coins-=100;state.squad.forEach(p=>p.rating=Math.min(99,p.rating+1));save();squad();toast('Training complete: +1 to every player’s rating.')}if(a==='upgrade'&&['stadium','training','academy'].includes(v)&&state[v]<5){const cost=state[v]*200;if(state.coins<cost)return toast('You need '+cost+' credits.');state.coins-=cost;state[v]++;save();office()}if(a==='rename'){const name=$('#clubname').value.trim();if(name){state.club=name;save();office();toast('Club name updated.')}}if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='screamer-club.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(a==='import')$('#importFile').click();if(a==='newseason')nextSeason();if(a==='pause')pause();if(a==='pass')pass();if(a==='shoot')autoShoot();if(a==='switch')switchPlayer();if(a==='sound'){sound=!sound;b.textContent='SOUND: '+(sound?'ON':'OFF');beep()}if(a==='quit'||a==='done'){cancelAnimationFrame(frame);game=null;screen='home';home()} });
home();if(loadWarning)toast(loadWarning);
